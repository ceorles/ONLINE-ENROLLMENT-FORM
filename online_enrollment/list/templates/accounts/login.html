<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <div>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div>
                <button type="submit">Login</button>
                <p>Don't have an account?<a href="{% url 'registerUser' %}">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
